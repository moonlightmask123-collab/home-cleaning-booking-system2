<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Home Cleaning</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="register">
<div id="navbar"></div>
<div class="container py-5">
  <div class="row justify-content-center"><div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h3 class="mb-3 text-center">Create Account</h3>
      <div id="message"></div>
      <form id="registerForm" novalidate>
        <div class="mb-3"><label class="form-label">Full Name</label><input type="text" id="name" class="form-control"></div>
        <div class="mb-3"><label class="form-label">Email</label><input type="email" id="email" class="form-control"></div>
        <div class="mb-3"><label class="form-label">Phone Number</label><input type="text" id="phone" class="form-control" maxlength="10"></div>
        <div class="mb-3"><label class="form-label">Password</label><input type="password" id="password" class="form-control"></div>
        <div class="mb-3"><label class="form-label">Confirm Password</label><input type="password" id="confirmPassword" class="form-control"></div>
        <div class="mb-3"><label class="form-label">Address</label><textarea id="address" class="form-control" rows="2"></textarea></div>
        <button type="submit" class="btn btn-brand w-100">Register</button>
      </form>
      <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div></div>
</div>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
