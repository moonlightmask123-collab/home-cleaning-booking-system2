<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Service | Home Cleaning</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="booking">
<div id="navbar"></div>
<div class="container py-5">
  <div class="row justify-content-center"><div class="col-md-8 col-lg-6">
    <div class="card p-4">
      <h3 class="mb-3 text-center">Book a Cleaning Slot</h3>
      <div id="message"></div>
      <form id="bookingForm" novalidate>
        <div class="mb-3"><label class="form-label">Selected Service</label>
          <select id="service" class="form-select"></select></div>
        <div class="mb-2" id="priceBox"></div>
        <div class="mb-3"><label class="form-label">Date</label><input type="date" id="date" class="form-control"></div>
        <div class="mb-3"><label class="form-label">Time Slot</label>
          <select id="slot" class="form-select"></select></div>
        <div class="mb-3"><label class="form-label">Address</label><textarea id="address" class="form-control" rows="2"></textarea></div>
        <button type="submit" class="btn btn-brand w-100">Confirm Booking</button>
      </form>
      <div id="summary" class="mt-4"></div>
    </div>
  </div></div>
</div>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
