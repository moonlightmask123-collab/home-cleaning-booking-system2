<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin | Home Cleaning</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="admin">
<div id="navbar"></div>
<div class="container py-5">
  <div id="message"></div>
  <div class="row justify-content-center" id="adminLogin">
    <div class="col-md-6 col-lg-4"><div class="card p-4">
      <h3 class="mb-3 text-center">Admin Login</h3>
      <form id="adminLoginForm">
        <div class="mb-3"><label class="form-label">Password</label><input type="password" id="adminPassword" class="form-control" required></div>
        <button type="submit" class="btn btn-brand w-100">Login</button>
      </form>
    </div></div>
  </div>
  <div id="adminPanel" style="display:none">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <h2 class="mb-0">All Bookings</h2>
      <div><button class="btn btn-sm btn-outline-secondary me-1" id="adminRefresh">Refresh</button>
      <button class="btn btn-sm btn-outline-danger" id="adminLogout">Logout</button></div>
    </div>
    <div class="mb-3" id="stats"></div>
    <div class="row g-2 mb-3">
      <div class="col-md-3"><select id="fStatus" class="form-select"><option value="">All statuses</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select></div>
      <div class="col-md-5"><input id="fSearch" class="form-control" placeholder="Search name, phone, service, date..."></div>
    </div>
    <div class="table-responsive"><table class="table table-bordered table-striped align-middle">
      <thead><tr><th>#</th><th>Customer</th><th>Service</th><th>When</th><th>Address</th><th style="min-width:140px">Status</th></tr></thead>
      <tbody id="adminRows"></tbody></table></div>
  </div>
</div>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
