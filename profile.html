<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | Home Cleaning</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="profile">
<div id="navbar"></div>
<div class="container py-5">
  <div class="row justify-content-center"><div class="col-md-6">
    <div class="card p-4">
      <h3 class="mb-3 text-center">My Profile</h3>
      <div id="message"></div>
      <table class="table mb-0" id="profileTable" style="display:none">
        <tr><th>Name</th><td id="pName"></td></tr>
        <tr><th>Email</th><td id="pEmail"></td></tr>
        <tr><th>Phone</th><td id="pPhone"></td></tr>
        <tr><th>Address</th><td id="pAddress"></td></tr>
      </table>
    </div>
  </div></div>
</div>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
